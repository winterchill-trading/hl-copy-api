name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: winterchill-trading/infra/.github/actions/ox-setup@main
        with:
          # hl-copy-api-types is one package of the hl-copy-web repository; pinning it
          # by name leaves the web app (and bonsai_web) out of this switch.
          pins: |
            fixed-decimal https://github.com/winterchill-trading/fixed-decimal.git
            exchange-core https://github.com/winterchill-trading/exchange-core.git
            order-book https://github.com/winterchill-trading/order-book.git
            exchange-core-engine https://github.com/winterchill-trading/exchange-core.git
            hl-protocol https://github.com/winterchill-trading/hl-protocol.git
            parquet https://github.com/winterchill-trading/parquet.git
            market-data https://github.com/winterchill-trading/market-data.git
            price-anchor https://github.com/winterchill-trading/price-anchor.git
            venue-net https://github.com/winterchill-trading/venue-net.git
            hl-client https://github.com/winterchill-trading/hl-client.git
            binance-protocol https://github.com/winterchill-trading/binance-protocol.git
            mm-core https://github.com/winterchill-trading/mm-core.git
            binance-client https://github.com/winterchill-trading/binance-client.git
            hl-sim https://github.com/winterchill-trading/hl-sim.git
            hl-copy-core https://github.com/winterchill-trading/hl-copy-core.git
            hl-leaderboard https://github.com/winterchill-trading/hl-leaderboard.git
            hl-copy-api-types https://github.com/winterchill-trading/hl-copy-web.git
      - run: shellcheck scripts/*.sh
      - run: opam exec -- dune build
      - run: opam exec -- dune test
  e2e-stack:
    # scripts/e2e-stack.sh: hl-sim, hl-leaderboard, this API and hl-copy-engine, built
    # from a dune workspace of their main branches, then hl-copy-web's live smoke test
    # against the API. Every other sibling comes from the pinned switch.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/hl-copy-api
      - uses: actions/checkout@v4
        with:
          repository: winterchill-trading/hl-copy-engine
          path: ws/hl-copy-engine
      - uses: actions/checkout@v4
        with:
          repository: winterchill-trading/hl-sim
          path: ws/hl-sim
      - uses: actions/checkout@v4
        with:
          repository: winterchill-trading/hl-leaderboard
          path: ws/hl-leaderboard
      - uses: actions/checkout@v4
        with:
          repository: winterchill-trading/hl-copy-web
          path: ws/hl-copy-web
      - name: Workspace root and the opam files whose dependencies to install
        # hl-copy-web.opam wants hl-copy-api-types at its own version; here that package
        # comes from the workspace, so the constraint is dropped.
        run: |
          echo '(lang dune 3.17)' > ws/dune-workspace
          mkdir -p e2e-deps
          cp ws/hl-copy-api/hl-copy-api.opam ws/hl-copy-engine/hl-copy-engine.opam e2e-deps/
          sed 's/"hl-copy-api-types" {= version}/"hl-copy-api-types"/' \
            ws/hl-copy-web/hl-copy-web.opam > e2e-deps/hl-copy-web.opam
      - uses: winterchill-trading/infra/.github/actions/ox-setup@main
        with:
          working-directory: e2e-deps
          pins: |
            fixed-decimal https://github.com/winterchill-trading/fixed-decimal.git
            exchange-core https://github.com/winterchill-trading/exchange-core.git
            order-book https://github.com/winterchill-trading/order-book.git
            exchange-core-engine https://github.com/winterchill-trading/exchange-core.git
            hl-protocol https://github.com/winterchill-trading/hl-protocol.git
            parquet https://github.com/winterchill-trading/parquet.git
            market-data https://github.com/winterchill-trading/market-data.git
            price-anchor https://github.com/winterchill-trading/price-anchor.git
            venue-net https://github.com/winterchill-trading/venue-net.git
            hl-client https://github.com/winterchill-trading/hl-client.git
            binance-protocol https://github.com/winterchill-trading/binance-protocol.git
            mm-core https://github.com/winterchill-trading/mm-core.git
            binance-client https://github.com/winterchill-trading/binance-client.git
            hl-sim https://github.com/winterchill-trading/hl-sim.git
            hl-copy-core https://github.com/winterchill-trading/hl-copy-core.git
            hl-leaderboard https://github.com/winterchill-trading/hl-leaderboard.git
            hl-copy-api-types https://github.com/winterchill-trading/hl-copy-web.git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: e2e-stack.sh
        env:
          WORKSPACE: ${{ github.workspace }}/ws
          OPAM_SWITCH: ${{ github.workspace }}
          LOG_DIR: ${{ github.workspace }}/e2e-logs
        run: |
          mkdir -p "$LOG_DIR"
          set -o pipefail
          ws/hl-copy-api/scripts/e2e-stack.sh 2>&1 | tee "$LOG_DIR/e2e-stack.txt"
      - name: Summary
        if: always()
        run: sed -n '/^check /,/^$/p' e2e-logs/e2e-stack.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-stack-${{ github.run_id }}
          path: e2e-logs
          retention-days: 14
  obj-magic:
    uses: winterchill-trading/infra/.github/workflows/obj-magic.yml@main
